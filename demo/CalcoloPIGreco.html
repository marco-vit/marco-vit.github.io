<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcoloNumericoPIgreco</title>
</head>
<body>
<canvas id="Canvas" width="800" height="800" ></canvas>
<script>
const canvas = document.getElementById("Canvas");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

// Creo la classe tartaruga per aiutarmi a disegnare sul canvas
class Tartaruga{
    // Metodo costruttore
    constructor(x, y){
        this.x = x;
        this.y = y;
        this.angolo = 0;
        this.penna = true;
    }

    // Metodo per disegnare delle linee
    avanti(d){
        const rad = this.angolo * Math.PI / 180;
        const nx = this.x + d * Math.cos(rad);
        const ny = this.y + d * Math.sin(rad);
        // Se la penna è abbassata disegna una linea da x a y
        if(this.penna){
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(nx, ny);
            ctx.stroke();
        }
        this.x = nx;
        this.y = ny;
    }

    // Metodo per ruotare
    ruota(a){
        this.angolo += a;
    }
}

function CalcoloNumericoPIgreco(){
    const l = 400;
    const nPuntiTotali = 1000000;
    let nAzzurri = 0;
    let PIGreco = 0;
    ctx.fillRect(0, 0, l, l);
    for(i = 0; i < nPuntiTotali; i++){
        let randomPoint = Math.random() * l;
        let randomPoint_2 = Math.random() * l;
        let distanza = Math.sqrt((Math.pow(randomPoint, 2)) + (Math.pow(randomPoint_2, 2)));
        ctx.beginPath(); 
        ctx.arc(randomPoint, randomPoint_2, 0.8, 0, 360);
        let c1 = 200 - randomPoint;
        let c2 = 200 - randomPoint_2;
        let d2 = Math.sqrt(Math.pow(c1, 2) + Math.pow(c2, 2));
        if(d2 <= 200){
            ctx.fillStyle = '#ADD8E6';
            nAzzurri++;
        }else{
            ctx.fillStyle = '#7F00FF'; 
        }
        ctx.fill();
    }
    PIGreco = (nAzzurri / nPuntiTotali) * 4;
    console.log(PIGreco);
}


function main(){
    CalcoloNumericoPIgreco();
}

window.addEventListener('load', main);

</script>
</body>
</html>
